<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéStore - Tienda</title>
    <link rel="stylesheet" href="css/tienda-less.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">PokéStore</div>
        <nav class="nav-menu">
            <a href="index.html">Volver al Inicio</a>
        </nav>
    </header>

    <main class="tienda-container">
        <h2>Productos Oficiales</h2>
        <div class="productos-grid">
            <article class="producto-item">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png" alt="Pokeball">
                <h4>Poké Ball</h4>
                <p>$200</p>
                <button class="btn-buy">Comprar</button>
            </article>
        </div>
    </main>
</body>
</html>
